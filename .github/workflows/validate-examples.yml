name: Validate public demo

on:
  push:
    paths:
      - ".codebuddy/**"
      - "config/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/validate-examples.yml"
  pull_request:
    paths:
      - ".codebuddy/**"
      - "config/**"
      - "docs/**"
      - "examples/**"
      - "scripts/**"
      - ".github/workflows/validate-examples.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate example contracts
        run: python scripts/validate_examples.py --strict
      - name: Exercise offline route generation
        run: >-
          python scripts/create_route_prototype.py
          --city "宣城"
          --poet "李白"
          --duration one_day
          --output examples/generated/ci-route.json
      - name: Revalidate generated public inputs
        run: python scripts/validate_examples.py --strict
